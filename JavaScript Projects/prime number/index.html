<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            border: 2px solid black;
        }

        .box {
            width: 300px;
            height: 300px;
            text-align: center;
        }

        .box input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 1rem;
        }

        .check-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            background: #4caf50;
            color: white;
        }

        #result {
            margin: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 style="margin: 1rem;">Prime Number checker</h2>
        <div class="box">
            <input type="number" name="prime-number" id="prime-number" placeholder="Enter Number">
            <button onclick="checkPrime()" class="check-btn">check</button>
            <h2 id="result"></h2>
        </div>
    </div>
</body>

<script>
    let inp = document.getElementById('prime-number');

    function checkPrime() {
        // console.log("num : " + num);
        let num = parseInt(inp.value);
        console.log("val : " + num);

        if (isNaN(num)) {
            alert("please enter a number");
            return;
        }
        let isPrime = true;
        if (num <= 1) {
            isPrime = false;
        } else {
            for (let i = 2; i * i < num; i++) {
                if (num % i === 0) {
                    isPrime = false;
                    break;
                }
            }
        }
        let resultBox = document.getElementById('result');
        isPrime == true ? resultBox.textContent = "Number is prime" : resultBox.textContent = "Number is not prime";

        setTimeout(() => {
            resultBox.textContent = "";
        }, 2000);

    }


</script>

</html>
