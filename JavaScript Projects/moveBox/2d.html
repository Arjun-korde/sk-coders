<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular movement</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .wrapper {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        #parent-box {
            height: 600px;
            width: 600px;
            background: #42e3a0;
            position: relative;
        }

        #box {
            position: absolute;
            background: #000;
            height: 100px;
            width: 100px;
            /* left: 20px; */
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div id="parent-box">
            <div id="box">

            </div>
        </div>

        <div class="btns">
            <button type="button" id="start-btn">Start</button>
            <button type="button" id="pause-btn">pause</button>
        </div>
    </div>
</body>
<script>
    let parentBox = document.getElementById("parent-box");
    let box = document.getElementById("box");
    let startBtn = document.querySelector("#start-btn");
    let pauseBtn = document.querySelector("#pause-btn");
    
    let boxBoundry = parentBox.getBoundingClientRect().width - box.getBoundingClientRect().width;

    let x = 0;
    let y = 0;

    let intervalId = null;
    let direction = 'right';

    function moveBox() {
        if (direction == 'right') {
            x++;
            if (x >= boxBoundry) direction = 'down';
        } else if (direction == 'down') {
            y++;
            if (y >= boxBoundry) direction = 'left';
        } else if (direction == 'left') {
            x--;
            if (x <= 0) direction = 'up';
        } else if (direction == 'up') {
            y--;
            if (y <= 0){
                direction = 'right';
                // completed one rounnd
                clearInterval(intervalId);
                intervalId = null;
            };
        }

        box.style.left = x + "px";
        box.style.top = y + "px";
    }

    startBtn.addEventListener('click', () => {

        if (intervalId) return;
        intervalId = setInterval(moveBox);
    });

    pauseBtn.addEventListener('click', () => {
        clearInterval(intervalId);
        intervalId = null;
    });



</script>

</html>
