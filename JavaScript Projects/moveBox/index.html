<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move Box</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: yellow;
            margin-bottom: 30px;
            position: absolute;
            left:0px
        }

        .move-btn {
            position: absolute;
            top: 150px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="box" class="box">

        </div>
        <button id="move" class="move-btn">
            Move
        </button>
    </div>

    <script>
        var box = document.getElementById('box');
        var btn = document.getElementById('move');
        btn.addEventListener('click', function () {


            if (box.offsetLeft > 0) {
                var id = setInterval(function () {
                    if (box.offsetLeft > 0){
                        box.style.left = (box.offsetLeft - 10) + "px";
                    }
                    else{
                        clearInterval(id)
                    }
                }, 10)
            }
            else {
                var id = setInterval(function () {
                    if (box.offsetLeft <= window.innerWidth - box.offsetWidth){
                        box.style.left = (box.offsetLeft + 10) + "px";
                    }
                    else{
                        clearInterval(id)
                    }
                }, 10)
            }


        })
    </script>
</body>

</html>
