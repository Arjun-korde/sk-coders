<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">   
</head>
<body>
    <div class="calculator">
        <h1 class="calculator-title">Calculator</h1>
        
        <div class="input-section">
            <div class="input-field">

                <input type="text" id="operand1" placeholder="Enter first number">
            </div>
            
            <div class="input-field">
                <input type="text" id="operand2" placeholder="Enter second number">
            </div>
        </div>

        <div class=" input-field">
             <input type="text" id="result" value="Result" placeholder="result">
        </div>

        <div class="operations">
            <button class="operation-btn" id="add">+</button>
            <button class="operation-btn" id="subtract">−</button>
            <button class="operation-btn" id="multiply">×</button>
            <button class="operation-btn" id="divide">÷</button>
        </div>

        <div class="numbers">
            <button class="number-btn" id="num1">1</button>
            <button class="number-btn" id="num2">2</button>
            <button class="number-btn" id="num3">3</button>
            <button class="number-btn" id="num4">4</button>
            <button class="number-btn" id="num5">5</button>
            <button class="number-btn" id="num6">6</button>
            <button class="number-btn" id="num7">7</button>
            <button class="number-btn" id="num8">8</button>
            <button class="number-btn" id="num9">9</button>
            <button class="number-btn zero" id="num0">0</button>
            <button class="number-btn" id="clearbtn">C</button>
        </div>

        <button class="equals-btn" id="equals">=</button>
    </div>
</body>
<script src="index.js"></script>
</html>
