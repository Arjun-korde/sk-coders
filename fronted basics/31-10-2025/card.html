<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="card.css">
</head>

<body>
    <div class="wrapper">
        <!-- Card List -->
        <div class="card-list">
            <!-- Card 1 -->
            <div class="card">
                <!-- Image Box  -->
                <div class="img-box">
                    <div class="img">
                        <img src="../assests/images/headphone.jpg" alt="">
                    </div>
                </div>
                <!-- Sale btn -->
                <div class="sale-btn">
                    SALE
                </div>
                <div class="product-description">
                    <div class="product-name">
                        Wireless Headphones
                    </div>
                    <p class="product-info">
                        High quality sound with noise cancellation
                    </p>
                    <div class="product-price">
                        $59.99
                    </div>
                </div>
                <button class="add-to-cart-btn" >Add to Cart</button>


            </div>

            <!-- Card 2 -->
             <div class="card">
                <!-- Image Box  -->
                <div class="img-box">
                    <div class="img">
                        <img src="../assests/images/watch.jpg" alt="">
                    </div>
                </div>
                <!-- Sale btn -->
                <div class="sale-btn">
                    SALE
                </div>
                <div class="product-description">
                    <div class="product-name">
                        Smart Watch
                    </div>
                    <p class="product-info">
                        Track your fitness and stay connected
                    </p>
                    <div class="product-price">
                        $89.99
                    </div>
                </div>
                <button class="add-to-cart-btn" >Add to Cart</button>


            </div>

            <!-- Card 3 -->
             <div class="card">
                <!-- Image Box  -->
                <div class="img-box">
                    <div class="img">
                        <img src="../assests/images/speaker.jpg" alt="">
                    </div>
                </div>
                <!-- Sale btn -->
                <div class="sale-btn">
                    SALE
                </div>
                <div class="product-description">
                    <div class="product-name">
                        Bluetooth Speaker
                    </div>
                    <p class="product-info">
                        Compact, powerful, and waterproof
                    </p>
                    <div class="product-price">
                        $39.99
                    </div>
                </div>
                <button class="add-to-cart-btn" >Add to Cart</button>


            </div>


        </div>
    </div>
</body>

</html>
