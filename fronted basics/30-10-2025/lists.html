<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
    <style>
        @font-face {
            font-family: Bitcount;
            src: url("../fonts/Bitcount/static/BitcountGridSingle-Regular.ttf");
        }
        * {
            font-family: Bitcount;
        }
    </style>
</head>
<body>
    <div>Ordered List</div>
    <ol>
        <li>Alchemist <ul>
            <li>Hello world</li>
        </ul></li>
        <li>Clean Code</li>
        <li>Design Patterns</li>
        <li>Atomic Habits</li>
        <li>Sapiens</li>
    </ol>

    <div>Unordered List</div>
    <ul>
        <li>Tea</li>
        <li>Guitar</li>
        <li>Coding</li>
    </ul>
</body>
</html>
