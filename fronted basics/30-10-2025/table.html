<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
         table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
         }
         table {
            width: 100%;
         }
         tr:nth-child(odd) {
            background-color: grey;
         } 
         @font-face {
            font-family: Rubik;
            src: url("../fonts/Rubik/static/Rubik-SemiBold.ttf");
        }

        * {
            font-family: Rubik;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Day</th>
            <th>Morning</th>
            <th>Afternoon</th>
            <th>Evening</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>Email</td>
            <td>Project Work</td>
            <td>Gym</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>Standup</td>
            <td>Code</td>
            <td>Reading</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>Design Review</td>
            <td>Meetings</td>
            <td>Practice</td>
        </tr>
    </table>
</body>
</html>
