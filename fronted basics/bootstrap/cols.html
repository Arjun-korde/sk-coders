<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .box {
            height: 100px;
            background-color: aquamarine; 
            text-align: center; 
        }
        .big-box {
            height: 300px;
            background-color: bisque;
            text-align: center;
        }
        .green {
            background-color: green;
        }

        .inner-box {
            height: 133px;
            background-color: cadetblue;
        }
    </style>
</head>

<body>
    <div class="m-2">
        <!-- Rows -->
        <div class="row mt-3">
            <div class="col-12 mb-4"><div class="bg-primary box">1</div></div>
            <div class="col-lg-6 col-md-12 mb-4 "><div class="box">2</div></div>
            <div class="col-lg-6 col-md-12 mb-4"><div class="box">3</div></div>
            <div class="col-lg-3 col-md-6 mb-4"><div class="box">4</div></div>
            <div class="col-lg-3 col-md-6 mb-4"><div class="box">5</div></div>
            <div class="col-lg-3 col-md-6 mb-4"><div class="box">6</div></div>
            <div class="col-lg-3 col-md-6 mb-4"><div class="box">7</div></div>
            <div class="col-lg-6 col-md-12 mb-4"><div class="big-box">8</div></div>

            <div class="col-lg-6 col-md-12 mb-4">

                <div class="row">
                    <div class="col-md-6 col-sm-12 mb-4">
                        <div class="inner-box mb-2">9</div>
                    </div>
                    <div class="col-md-6 col-sm-12 mb-4">
                        <div class="inner-box mb-2">9</div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 col-sm-12 mb-4">
                        <div class="inner-box mb-2">9</div>
                    </div>
                    <div class="col-md-6 col-sm-12 mb-4">
                        <div class="inner-box mb-2">9</div>
                    </div>
                </div>

            </div>
        </div>

    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
